services:
  - type: web
    name: stormbyte-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install --upgrade pip && pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://frontend-virid-nu-57pxwx9lvb.vercel.app","https://frontend-erl66fv60-paschim-banga-durgapuja-samannay-samity.vercel.app"]'
